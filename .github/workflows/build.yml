name: Build Vial Firmware
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vial-QMK
        uses: actions/checkout@v4
        with:
          # Важно для определения версии (ошибка 128)
          fetch-depth: 0
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr binutils-avr avr-libc gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Build Firmware
        run: |
          # Установка qmk через pip
          python3 -m pip install qmk
          
          # Компиляция
          # Для Corne v3:
          python3 -m qmk.cli compile -kb crkbd/rev1 -km vial
          
          # Для Corne v4 (если нужно, раскомментируйте):
          # python3 -m qmk.cli compile -kb crkbd/rev4/standard -km vial

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: corne-vial-firmware
          path: ./*.hex
